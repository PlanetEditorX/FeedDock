services:
  feeddock:
    image: ghcr.io/planeteditorx/feeddock:latest
    container_name: feeddock
    restart: unless-stopped
    pull_policy: always
    ports:
      - "7789:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: "Asia/Shanghai"
      PUID: "0"
      PGID: "0"
      UMASK: "002"
      TAKE_OWNERSHIP: "false"
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "password"
      SESSION_DAYS: "7"
      COOKIE_SECURE: "false"
      POLL_INTERVAL_MINUTES: "10"
      REQUEST_TIMEOUT_SECONDS: "20"

      # Mikan 番剧目录；若主域名不可用，会依次尝试备用地址
      MIKAN_BASE_URL: "https://mikanime.tv"
      MIKAN_FALLBACK_URLS: "https://mikanani.me,https://mikanani.kas.pub"
      MIKAN_CACHE_HOURS: "6"
      MIKAN_IMAGE_CACHE_DAYS: "30"
      MIKAN_THUMBNAIL_WIDTH: "240"
      MIKAN_THUMBNAIL_HEIGHT: "320"

      # 先不配置 qBittorrent
      QBIT_URL: ""
      QBIT_USERNAME: ""
      QBIT_PASSWORD: ""
      QBIT_CATEGORY: "rss"
      DOWNLOAD_PATH: "/media"

      # 元数据与 Emby 规范命名
      METADATA_LANGUAGE: "zh-CN"
      METADATA_AUTO_SYNC_HOURS: "24"
      TMDB_READ_ACCESS_TOKEN: ""
      BANGUMI_ACCESS_TOKEN: ""
      MEDIA_LOCAL_ROOT: "/media"
      EMBY_URL: ""
      EMBY_API_KEY: ""

      UPDATE_REPOSITORY: "planeteditorx/feeddock"
      UPDATE_API_URL: "https://api.github.com"
      # 可选：仅用于提高手动检查更新的 GitHub API 限额
      UPDATE_GITHUB_TOKEN: ""

      # 暂时关闭网页一键更新
      WATCHTOWER_URL: ""
      WATCHTOWER_TOKEN: ""

    volumes:
      - "/vol1/1000/应用/feeddock/data:/data"
      - "/vol2/1000/影视:/media"
