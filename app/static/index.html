<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FeedDock</title>
  <link rel="stylesheet" href="/static/style.css?v=1.8.0">
</head>
<body>
  <div id="toast" class="toast" hidden></div>

  <main id="login-view" class="auth-shell" hidden>
    <form id="login-form" class="panel auth-card">
      <div class="brand">FeedDock</div>
      <h1>登录</h1>
      <label>用户名<input name="username" autocomplete="username" value="admin" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">登录</button>
      <p class="muted">飞牛 OS 默认首次账号：<code>admin / password</code>。首次登录后必须修改密码。</p>
    </form>
  </main>

  <main id="password-view" class="auth-shell" hidden>
    <form id="password-form" class="panel auth-card">
      <div class="brand">FeedDock</div>
      <h1>修改初始密码</h1>
      <label>当前密码<input name="current_password" type="password" required></label>
      <label>新密码<input name="new_password" type="password" minlength="10" required></label>
      <label>确认新密码<input name="confirm_password" type="password" minlength="10" required></label>
      <button class="primary" type="submit">保存并重新登录</button>
    </form>
  </main>

  <div id="app-view" hidden>
    <header class="topbar">
      <div><strong>FeedDock</strong><span id="version" class="version"></span></div>
      <div class="top-actions">
        <button id="check-update" class="ghost">检查更新</button>
        <button id="logout" class="ghost">退出</button>
      </div>
    </header>

    <main class="page">
      <section class="stats" id="stats"></section>

      <section class="panel">
        <div class="section-head">
          <div>
            <h2>Mikan 番剧目录</h2>
            <p class="muted">默认读取本地缓存，每 6 小时最多后台更新一次；只有“强制更新”会立即访问 Mikan。</p>
          </div>
        </div>
        <div class="toolbar catalog-toolbar">
          <label>年份<input id="catalog-year" type="number" min="2010" max="2100"></label>
          <label>季度
            <select id="catalog-season">
              <option value="winter">冬季</option>
              <option value="spring">春季</option>
              <option value="summer">夏季</option>
              <option value="fall">秋季</option>
            </select>
          </label>
          <label class="grow">筛选标题<input id="catalog-search" placeholder="只过滤当前页面，不访问 Mikan"></label>
          <button id="load-catalog" class="primary">读取目录</button>
          <button id="force-catalog" class="danger-soft">强制更新</button>
        </div>
        <div id="catalog-meta" class="meta-line"></div>
        <div id="catalog" class="catalog"></div>
      </section>

      <section class="panel">
        <div class="section-head"><h2>添加或编辑订阅</h2></div>
        <form id="subscription-form" class="form-grid">
          <input type="hidden" name="id">
          <label>订阅名称<input name="name" required placeholder="例如：金牌得主 第二季"></label>
          <label>参考标题<input name="reference_title"></label>
          <label>TMDB 标题<input name="tmdb_title"></label>
          <label>Bangumi URL<input name="bgm_url"></label>
          <label>日期<input name="release_date" type="date"></label>
          <label>季<input name="season" type="number" min="1" value="1"></label>
          <label>主 RSS 名称<input name="primary_rss_name" placeholder="例如：LoliHouse"></label>
          <label class="span-2">主 RSS 地址<input name="primary_rss_url" type="url" required></label>
          <label>备用 RSS 名称<input name="backup_rss_name"></label>
          <label class="span-2">备用 RSS 地址<input name="backup_rss_url" type="url"></label>
          <label>匹配规则<textarea name="include_rules" rows="4" placeholder="每行一条；支持正则"></textarea></label>
          <label>排除规则<textarea name="exclude_rules" rows="4" placeholder="例如：720\n\d-\d\n合集\n特别篇"></textarea></label>
          <label>全局排除<textarea name="global_exclude_rules" rows="4" placeholder="例如：剧场版"></textarea></label>
          <label>自定义集数正则<input name="episode_regex" placeholder="\d+(\.5)?"></label>
          <label>捕获组<input name="episode_group" type="number" min="0" value="0"></label>
          <label>集数偏移<input name="episode_offset" type="number" step="0.5" value="0"></label>
          <label>总集数<input name="total_episodes" type="number" min="0" value="0"></label>
          <label class="span-2">自定义下载路径<input name="download_path" placeholder="/vol2/1000/影视/番剧/Season 2"></label>
          <label class="check"><input name="missing_check" type="checkbox">遗漏检测</label>
          <label class="check"><input name="latest_only" type="checkbox">只下载最新集</label>
          <label class="check"><input name="enabled" type="checkbox" checked>启用</label>
          <div class="form-actions span-all">
            <button class="primary" type="submit">保存订阅</button>
            <button id="reset-subscription" type="button" class="ghost">清空</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="section-head"><h2>订阅列表</h2></div>
        <div id="subscriptions" class="table-wrap"></div>
      </section>

      <section class="panel">
        <div class="section-head"><h2>qBittorrent 下载器</h2></div>
        <form id="qbit-form" class="form-grid compact">
          <label class="span-2">WebUI 地址<input name="url" placeholder="http://host.docker.internal:8080"></label>
          <label>用户名<input name="username"></label>
          <label>密码<input name="password" type="password" placeholder="留空保留原密码"></label>
          <label>分类<input name="category" value="rss"></label>
          <label class="span-2">下载保存路径<input name="download_path"></label>
          <div class="form-actions span-all">
            <button class="primary" type="submit">保存并测试连接</button>
            <button id="test-qbit" type="button" class="ghost">仅测试</button>
            <button id="reset-qbit" type="button" class="ghost">恢复 Compose 默认</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="section-head"><h2>运行日志</h2><button id="reload-logs" class="ghost">刷新</button></div>
        <div id="logs" class="log-list"></div>
      </section>
    </main>
  </div>

  <dialog id="bangumi-dialog" class="dialog">
    <button id="close-dialog" class="dialog-close" aria-label="关闭">×</button>
    <div id="bangumi-detail"></div>
  </dialog>

  <script src="/static/app.js?v=1.8.0" defer></script>
</body>
</html>
