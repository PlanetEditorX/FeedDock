<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>修改密码 · FeedDock</title>
  <link rel="icon" type="image/png" href="/static/feeddock-icon.png">
  <link rel="stylesheet" href="/static/styles.css?v=1.17.12">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-card">
      <img class="brand-mark" src="/static/feeddock-icon.png" alt="FeedDock">
      <span id="passwordPageBadge" class="badge error">首次登录安全设置</span>
      <h1 id="passwordPageTitle">请修改初始密码</h1>
      <p id="passwordPageDescription" class="muted">完成修改前，订阅、下载器和更新接口都会被锁定。</p>
      <div id="authError" class="auth-error hidden"></div>
      <form id="passwordForm" class="auth-form">
        <label>当前密码<span class="password-field"><input name="current_password" type="password" autocomplete="current-password" required autofocus><button type="button" class="password-toggle" aria-label="显示密码">👁</button></span></label>
        <label>新密码<span class="password-field"><input name="new_password" type="password" autocomplete="new-password" minlength="10" required><button type="button" class="password-toggle" aria-label="显示密码">👁</button></span></label>
        <label>确认新密码<span class="password-field"><input name="confirm_password" type="password" autocomplete="new-password" minlength="10" required><button type="button" class="password-toggle" aria-label="显示密码">👁</button></span></label>
        <button id="passwordSubmit" type="submit">保存新密码并进入系统</button>
      </form>
      <p class="auth-note">密码至少 10 个字符，不能与用户名或示例默认密码相同。</p><a id="passwordPageBack" class="button-link secondary hidden" href="/#settings-login">返回登录设置</a>
    </section>
  </main>
  <script src="/static/change-password.js?v=1.17.12" defer></script>
</body>
</html>
