<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>修改初始密码 · FeedDock</title>
  <link rel="stylesheet" href="/static/styles.css?v=1.3.2">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-card">
      <div class="brand-mark">FD</div>
      <span class="badge error">首次登录安全设置</span>
      <h1>请修改初始密码</h1>
      <p class="muted">完成修改前，订阅、下载器和更新接口都会被锁定。</p>
      <div id="authError" class="auth-error hidden"></div>
      <form id="passwordForm" class="auth-form">
        <label>当前密码<input name="current_password" type="password" autocomplete="current-password" required autofocus></label>
        <label>新密码<input name="new_password" type="password" autocomplete="new-password" minlength="10" required></label>
        <label>确认新密码<input name="confirm_password" type="password" autocomplete="new-password" minlength="10" required></label>
        <button type="submit">保存新密码并进入系统</button>
      </form>
      <p class="auth-note">密码至少 10 个字符，不能与用户名或示例默认密码相同。</p>
    </section>
  </main>
  <script src="/static/change-password.js?v=1.3.2" defer></script>
</body>
</html>
