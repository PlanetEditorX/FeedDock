services:
  feeddock:
    build:
      context: .
      args:
        APP_VERSION: ${FEEDDOCK_BUILD_VERSION:-1.8.0}
    image: ${FEEDDOCK_IMAGE:-feeddock:local}
    container_name: feeddock
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FEEDDOCK_IMAGE: "${FEEDDOCK_IMAGE:-feeddock:local}"
    ports:
      - "${APP_PORT:-7789}:8000"
    volumes:
      - ./data:/data
      - ./downloads:/downloads
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      - feeddock-net

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: feeddock-qbittorrent
    profiles: ["with-qbit"]
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Asia/Shanghai}"
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    ports:
      - "${QBIT_WEBUI_PORT:-8080}:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./qbit-config:/config
      - ./downloads:/downloads
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    networks:
      - feeddock-net

  watchtower:
    image: containrrr/watchtower:latest
    container_name: feeddock-updater
    profiles: ["updater"]
    restart: unless-stopped
    environment:
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: "${WATCHTOWER_TOKEN}"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    networks:
      - feeddock-net

networks:
  feeddock-net:
    driver: bridge
