services:
  feeddock:
    image: "${FEEDDOCK_IMAGE:-ghcr.io/planeteditorx/feeddock:latest}"
    pull_policy: always
    container_name: feeddock
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FEEDDOCK_IMAGE: "${FEEDDOCK_IMAGE:-ghcr.io/planeteditorx/feeddock:latest}"
      UPDATE_CHECK_CACHE_HOURS: "${UPDATE_CHECK_CACHE_HOURS:-6}"
      UPDATE_REGISTRY_USERNAME: "${UPDATE_REGISTRY_USERNAME:-}"
      UPDATE_REGISTRY_TOKEN: "${UPDATE_REGISTRY_TOKEN:-}"
      WATCHTOWER_URL: "${WATCHTOWER_URL:-http://watchtower:8080}"
      WATCHTOWER_TOKEN: "${WATCHTOWER_TOKEN:-}"
    ports:
      - "${APP_PORT:-7789}:8000"
    # Override Docker's inherited resolver. Recreate the container after changing DNS.
    dns:
      - "${FEEDDOCK_DNS_PRIMARY:-223.5.5.5}"
      - "${FEEDDOCK_DNS_SECONDARY:-119.29.29.29}"
      - "${FEEDDOCK_DNS_TERTIARY:-1.1.1.1}"
    dns_opt:
      - "timeout:2"
      - "attempts:2"
      - "rotate"
    volumes:
      - ./data:/data
      - ./downloads:/media
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      - feeddock-net

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: feeddock-qbittorrent
    profiles: ["with-qbit"]
    restart: unless-stopped
    environment:
      PUID: "${PUID:-0}"
      PGID: "${PGID:-0}"
      TZ: "${TZ:-Asia/Shanghai}"
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    ports:
      - "${QBIT_WEBUI_PORT:-8080}:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./qbit-config:/config
      - ./downloads:/media
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    networks:
      - feeddock-net

  watchtower:
    image: containrrr/watchtower:latest
    container_name: feeddock-updater
    profiles: ["updater"]
    restart: unless-stopped
    environment:
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: "${WATCHTOWER_TOKEN:-}"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
    dns:
      - "${FEEDDOCK_DNS_PRIMARY:-223.5.5.5}"
      - "${FEEDDOCK_DNS_SECONDARY:-119.29.29.29}"
      - "${FEEDDOCK_DNS_TERTIARY:-1.1.1.1}"
    dns_opt:
      - "timeout:2"
      - "attempts:2"
      - "rotate"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    networks:
      - feeddock-net

networks:
  feeddock-net:
    driver: bridge
