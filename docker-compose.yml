services:
  feeddock:
    image: "${FEEDDOCK_IMAGE:-ghcr.io/planeteditorx/feeddock:latest}"
    pull_policy: always
    container_name: feeddock
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FEEDDOCK_IMAGE: "${FEEDDOCK_IMAGE:-ghcr.io/planeteditorx/feeddock:latest}"
      UPDATE_CHECK_CACHE_HOURS: "${UPDATE_CHECK_CACHE_HOURS:-6}"
      UPDATE_REGISTRY_USERNAME: "${UPDATE_REGISTRY_USERNAME:-}"
      UPDATE_REGISTRY_TOKEN: "${UPDATE_REGISTRY_TOKEN:-}"
      FEEDDOCK_UPDATER_URL: "${FEEDDOCK_UPDATER_URL:-http://updater:8090}"
      FEEDDOCK_UPDATER_TOKEN: "${FEEDDOCK_UPDATER_TOKEN:-}"
      FEEDDOCK_UPDATER_TOKEN_FILE: "${FEEDDOCK_UPDATER_TOKEN_FILE:-/run/feeddock-updater/token}"
    ports:
      - "${APP_PORT:-7789}:8000"
    # Override Docker's inherited resolver. Recreate the container after changing DNS.
    dns:
      - "${FEEDDOCK_DNS_PRIMARY:-223.5.5.5}"
      - "${FEEDDOCK_DNS_SECONDARY:-119.29.29.29}"
      - "${FEEDDOCK_DNS_TERTIARY:-1.1.1.1}"
    dns_opt:
      - "timeout:2"
      - "attempts:2"
      - "rotate"
    # Docker 桥接网默认不带 IPv6 路由；禁用容器 IPv6 可避免对含 AAAA 记录的
    # 域名建连时抛 [Errno 101] Network is unreachable。改后需重建容器。
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    volumes:
      - ./data:/data
      - ./downloads:/media
      - feeddock-updater-state:/run/feeddock-updater:ro
    depends_on:
      updater:
        condition: service_healthy
    networks:
      - feeddock-net

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: feeddock-qbittorrent
    profiles: ["with-qbit"]
    restart: unless-stopped
    environment:
      PUID: "${PUID:-0}"
      PGID: "${PGID:-0}"
      TZ: "${TZ:-Asia/Shanghai}"
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    ports:
      - "${QBIT_WEBUI_PORT:-8080}:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./qbit-config:/config
      - ./downloads:/media
    networks:
      - feeddock-net

  updater:
    build:
      context: ./updater
    container_name: feeddock-updater
    restart: unless-stopped
    environment:
      UPDATER_TOKEN: "${FEEDDOCK_UPDATER_TOKEN:-}"
      UPDATER_TOKEN_FILE: "/state/token"
      UPDATER_COMPOSE_FILE: "/workspace/docker-compose.yml"
      UPDATER_PROJECT_DIR: "/workspace"
      UPDATER_ENV_FILE: "/workspace/.env"
      UPDATER_SERVICE: "feeddock"
      UPDATER_CONTAINER: "feeddock"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro
      - feeddock-updater-state:/state
    networks:
      - feeddock-net

networks:
  feeddock-net:
    driver: bridge

volumes:
  feeddock-updater-state:
