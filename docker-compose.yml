services:
  feeddock:
    image: ${FEEDDOCK_IMAGE:-feeddock:local}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: feeddock
    restart: unless-stopped
    ports:
      - "${FEEDDOCK_PORT:-7789}:8000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-022}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      POLL_INTERVAL_MINUTES: ${POLL_INTERVAL_MINUTES:-10}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-20}
      QBIT_URL: ${QBIT_URL:-}
      QBIT_USERNAME: ${QBIT_USERNAME:-}
      QBIT_PASSWORD: ${QBIT_PASSWORD:-}
      QBIT_CATEGORY: ${QBIT_CATEGORY:-rss}
      DOWNLOAD_PATH: ${DOWNLOAD_PATH:-/downloads/rss}
      MIKAN_BASE_URL: ${MIKAN_BASE_URL:-https://mikanani.me}
      MIKAN_FALLBACK_URLS: ${MIKAN_FALLBACK_URLS:-https://mikanime.tv,https://mikanani.kas.pub}
      MIKAN_CACHE_HOURS: ${MIKAN_CACHE_HOURS:-6}
      UPDATE_REPOSITORY: ${UPDATE_REPOSITORY:-planeteditorx/feeddock}
      UPDATE_API_URL: ${UPDATE_API_URL:-https://api.github.com}
      UPDATE_GITHUB_TOKEN: ${UPDATE_GITHUB_TOKEN:-}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
