name: Build and publish Docker image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
    paths:
      - Dockerfile
      - docker-entrypoint.py
      - requirements.txt
      - VERSION
      - "app/**"
      - "tests/**"
      - docker-compose.yml
      - ".github/workflows/docker-publish.yml"
  pull_request:
    paths:
      - Dockerfile
      - docker-entrypoint.py
      - requirements.txt
      - VERSION
      - "app/**"
      - "tests/**"
      - docker-compose.yml
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      push_image:
        description: "构建完成后推送镜像到 GHCR"
        required: true
        default: true
        type: boolean
      image_tag:
        description: "额外镜像标签，例如 dev、nightly 或 1.0.0"
        required: true
        default: "manual"
        type: string

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run tests
        run: python -m unittest discover -s tests -v

  build-and-push:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve application version
        id: app_version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "$version" ]]; then
            echo "VERSION 文件不能为空" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Git 标签 ${GITHUB_REF_NAME} 与 VERSION=${version} 不一致" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=FeedDock
            org.opencontainers.image.description=Self-hosted RSS automation service for qBittorrent

      - name: Build and optionally push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            APP_VERSION=${{ steps.app_version.outputs.value }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Publish build summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Docker 镜像构建"
            echo
            echo "- 镜像：\`${{ steps.image.outputs.name }}\`"
            echo "- 平台：\`linux/amd64, linux/arm64\`"
            echo "- 推送：\`${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}\`"
            echo "- Digest：\`${{ steps.build.outputs.digest || '仅构建，未生成远程 digest' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
