name: Build and publish Docker image

on:
  push:
    branches: [main, master]
    paths:
      - Dockerfile
      - docker-entrypoint.py
      - requirements.txt
      - pyproject.toml
      - poetry.lock
      - uv.lock
      - VERSION
      - "app/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - docker-compose.yml
      - docker-compose.fnos.yml
      - .env.example
      - .env.fnos.example
      - ".github/release-paths.txt"
      - ".github/workflows/docker-publish.yml"
  pull_request:
    paths:
      - Dockerfile
      - docker-entrypoint.py
      - requirements.txt
      - pyproject.toml
      - poetry.lock
      - uv.lock
      - VERSION
      - "app/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - docker-compose.yml
      - docker-compose.fnos.yml
      - .env.example
      - .env.fnos.example
      - ".github/release-paths.txt"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      push_image:
        description: "构建完成后推送镜像"
        required: true
        default: true
        type: boolean
      force_build:
        description: "即使远端 latest 已是当前提交，也重新构建并递增补丁版本"
        required: true
        default: false
        type: boolean
      image_tag:
        description: "额外镜像标签，例如 dev 或 nightly"
        required: true
        default: "manual"
        type: string

concurrency:
  group: image-publish-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run validation and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate base version
        run: python scripts/release_version.py check

      - name: Validate frontend JavaScript syntax
        run: |
          node --check app/static/mikan-subscription-state.js
          node --check app/static/subscription-sources.js
          node --check app/static/navigation.js
          node --check app/static/modules/notification-settings.js
          node --check app/static/app.js
          node --check app/static/login.js
          node --check app/static/change-password.js

      - name: Validate Compose YAML
        run: |
          python -m pip install PyYAML==6.0.3
          python - <<'PY'
          from pathlib import Path
          import yaml

          for compose_path in (Path("docker-compose.yml"), Path("docker-compose.fnos.yml")):
              payload = yaml.safe_load(compose_path.read_text(encoding="utf-8"))
              feeddock = payload["services"]["feeddock"]
              watchtower = payload["services"]["watchtower"]

              assert "ghcr.io/planeteditorx/feeddock:latest" in str(feeddock.get("image", ""))
              assert feeddock["environment"]["WATCHTOWER_URL"] == "${WATCHTOWER_URL:-http://watchtower:8080}"
              assert "updater" in (watchtower.get("profiles") or [])
              assert "/var/run/docker.sock:/var/run/docker.sock" in (watchtower.get("volumes") or [])
              assert watchtower["environment"]["WATCHTOWER_HTTP_API_UPDATE"] == "true"
              assert watchtower["environment"]["WATCHTOWER_HTTP_API_TOKEN"] == "${WATCHTOWER_TOKEN:-}"

          fnos = yaml.safe_load(Path("docker-compose.fnos.yml").read_text(encoding="utf-8"))
          service = fnos["services"]["feeddock"]
          assert "host.docker.internal:host-gateway" in set(service.get("extra_hosts") or [])
          required_volumes = {
              "${FEEDDOCK_DATA_PATH:-/vol1/1000/应用/feeddock/data}:/data",
              "${FEEDDOCK_MEDIA_PATH:-/vol2/1000/影视}:/media",
          }
          assert required_volumes.issubset(set(service.get("volumes") or []))
          PY

  pull-request-build:
    name: Build pull request image
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=FeedDock
            org.opencontainers.image.version=pr-${{ github.event.pull_request.number }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            APP_VERSION=pr-${{ github.event.pull_request.number }}
            APP_REVISION=${{ github.sha }}
            APP_CREATED_AT=${{ github.event.pull_request.updated_at }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  publish:
    name: Detect image changes and publish
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Detect image-impacting changes
        id: changes
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            build_requested=true
            matched_files="manual workflow dispatch"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
            build_requested="$(python scripts/release_version.py detect \
              --base "$base" \
              --head "$GITHUB_SHA" \
              --paths-file .github/release-paths.txt \
              --format boolean)"
            matched_files="$(python scripts/release_version.py detect \
              --base "$base" \
              --head "$GITHUB_SHA" \
              --paths-file .github/release-paths.txt \
              --format lines)"
          fi

          echo "build_requested=$build_requested" >> "$GITHUB_OUTPUT"
          {
            echo "matched_files<<EOF"
            printf '%s\n' "$matched_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python for registry inspection
        if: steps.changes.outputs.build_requested == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install registry inspection dependencies
        if: steps.changes.outputs.build_requested == 'true'
        run: python -m pip install -r requirements.txt

      - name: Inspect current remote image metadata
        id: remote
        if: steps.changes.outputs.build_requested == 'true'
        env:
          UPDATE_REGISTRY_USERNAME: ${{ github.actor }}
          UPDATE_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/feeddock-registry"
          set +e
          metadata="$(DATA_DIR="$RUNNER_TEMP/feeddock-registry" \
            python scripts/inspect_registry_image.py "${{ steps.image.outputs.name }}:latest" 2>registry-error.log)"
          inspect_status=$?
          set -e

          if [[ "$inspect_status" == "0" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "version=$(jq -r '.version // empty' <<< "$metadata")" >> "$GITHUB_OUTPUT"
            echo "revision=$(jq -r '.revision // empty' <<< "$metadata")" >> "$GITHUB_OUTPUT"
            echo "digest=$(jq -r '.digest // empty' <<< "$metadata")" >> "$GITHUB_OUTPUT"
          elif [[ "$inspect_status" == "3" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "revision=" >> "$GITHUB_OUTPUT"
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "远端 latest 镜像尚不存在，将使用 VERSION 作为首个镜像版本。"
          else
            cat registry-error.log >&2 || true
            echo "无法安全读取远端镜像版本，停止发布以避免覆盖已有版本标签。" >&2
            exit "$inspect_status"
          fi

      - name: Resolve build decision and image version
        id: version
        if: steps.changes.outputs.build_requested == 'true'
        shell: bash
        run: |
          push_enabled=true
          force_build=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            push_enabled="${{ inputs.push_image }}"
            force_build="${{ inputs.force_build }}"
          fi

          build_needed=true
          if [[ "$force_build" != "true" && "${{ steps.remote.outputs.revision }}" == "$GITHUB_SHA" ]]; then
            build_needed=false
          fi

          base_version="$(tr -d '[:space:]' < VERSION)"
          latest_version="${{ steps.remote.outputs.version }}"
          if [[ "$build_needed" == "true" ]]; then
            value="$(python scripts/release_version.py next \
              --base "$base_version" \
              --latest-image "$latest_version")"
          else
            value="${latest_version:-$base_version}"
          fi

          IFS=. read -r major minor patch <<< "$value"
          echo "build_needed=$build_needed" >> "$GITHUB_OUTPUT"
          echo "push_enabled=$push_enabled" >> "$GITHUB_OUTPUT"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major.$minor" >> "$GITHUB_OUTPUT"
          echo "created_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.version.outputs.build_needed == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.version.outputs.build_needed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.build_needed == 'true' && steps.version.outputs.push_enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        if: steps.version.outputs.build_needed == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=FeedDock
            org.opencontainers.image.description=Self-hosted RSS automation service for qBittorrent
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.created_at }}

      - name: Build and optionally publish image
        id: build
        if: steps.version.outputs.build_needed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            APP_REVISION=${{ github.sha }}
            APP_CREATED_AT=${{ steps.version.outputs.created_at }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.version.outputs.push_enabled == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Create optional GitHub Release record
        if: steps.version.outputs.build_needed == 'true' && steps.version.outputs.push_enabled == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.version.outputs.value }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG 已存在。"
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "FeedDock $RELEASE_TAG" \
              --generate-notes \
              --latest
          fi

      - name: Publish workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "### FeedDock 镜像发布"
            echo
            echo "- 重要文件变化：\`${{ steps.changes.outputs.build_requested || 'false' }}\`"
            echo "- 远端镜像版本：\`${{ steps.remote.outputs.version || '无' }}\`"
            echo "- 远端镜像 revision：\`${{ steps.remote.outputs.revision || '无' }}\`"
            echo "- 构建新镜像：\`${{ steps.version.outputs.build_needed || 'false' }}\`"
            echo "- 新镜像版本：\`${{ steps.version.outputs.value || '未生成' }}\`"
            echo "- 新镜像 digest：\`${{ steps.build.outputs.digest || '未推送或未构建' }}\`"
            if [[ -n "${{ steps.changes.outputs.matched_files }}" ]]; then
              echo
              echo "#### 触发构建的文件"
              echo '```text'
              printf '%s\n' "${{ steps.changes.outputs.matched_files }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
