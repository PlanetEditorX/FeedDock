name: Build and publish Docker image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
    paths:
      - Dockerfile
      - docker-entrypoint.py
      - requirements.txt
      - VERSION
      - update.json
      - "app/**"
      - "tests/**"
      - docker-compose.yml
      - docker-compose.fnos.yml
      - .env.fnos.example
      - FNOS_DEPLOY.md
      - ".github/workflows/docker-publish.yml"
  pull_request:
    paths:
      - Dockerfile
      - docker-entrypoint.py
      - requirements.txt
      - VERSION
      - update.json
      - "app/**"
      - "tests/**"
      - docker-compose.yml
      - docker-compose.fnos.yml
      - .env.fnos.example
      - FNOS_DEPLOY.md
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      push_image:
        description: "构建完成后推送镜像到 GHCR"
        required: true
        default: true
        type: boolean
      image_tag:
        description: "额外镜像标签，例如 dev、nightly 或 1.0.0"
        required: true
        default: "manual"
        type: string

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate static update manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          manifest = json.loads(Path("update.json").read_text(encoding="utf-8"))
          assert manifest["version"] == version
          assert f"/v{version}" in manifest["release_url"]
          PY

      - name: Validate frontend JavaScript syntax
        run: |
          node --check app/static/mikan-subscription-state.js
          node --check app/static/subscription-sources.js
          node --check app/static/navigation.js
          node --check app/static/app.js
          node --check app/static/login.js
          node --check app/static/change-password.js

      - name: Validate fnOS Compose YAML
        run: |
          python -m pip install PyYAML==6.0.3
          python - <<'PY'
          from pathlib import Path
          import yaml

          payload = yaml.safe_load(Path("docker-compose.fnos.yml").read_text(encoding="utf-8"))
          service = payload["services"]["feeddock"]

          image = str(service.get("image", ""))
          assert image.startswith("ghcr.io/planeteditorx/feeddock:"), f"Unexpected image: {image!r}"

          extra_hosts = set(service.get("extra_hosts") or [])
          required_host = "host.docker.internal:host-gateway"
          assert required_host in extra_hosts, f"Missing extra_hosts entry: {required_host}"

          volumes = set(service.get("volumes") or [])
          required_volumes = {
              "/vol1/1000/应用/feeddock/data:/data",
              "/vol2/1000/影视:/media",
          }
          missing_volumes = required_volumes - volumes
          assert not missing_volumes, f"Missing fnOS volume mounts: {sorted(missing_volumes)}"

          environment = service.get("environment") or {}
          assert environment.get("DOWNLOAD_PATH") == "/media", "DOWNLOAD_PATH must be /media"
          assert environment.get("MEDIA_LOCAL_ROOT") == "/media", "MEDIA_LOCAL_ROOT must be /media"
          PY

  build-and-push:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve application version
        id: app_version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "$version" ]]; then
            echo "VERSION 文件不能为空" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION 必须是语义化版本，例如 1.3.2" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          major_minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Git 标签 ${GITHUB_REF_NAME} 与 VERSION=${version} 不一致" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"

      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ steps.app_version.outputs.value }}
            type=raw,value=${{ steps.app_version.outputs.major_minor }}
            type=raw,value=${{ steps.app_version.outputs.major }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=FeedDock
            org.opencontainers.image.description=Self-hosted RSS automation service for qBittorrent

      - name: Build and optionally push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            APP_VERSION=${{ steps.app_version.outputs.value }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Create GitHub Release after image publish
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.app_version.outputs.value }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG 已存在，本次不重复创建"
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "FeedDock $RELEASE_TAG" \
              --generate-notes \
              --latest
            echo "已创建 Git 标签和 GitHub Release：$RELEASE_TAG"
          fi

      - name: Publish build summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Docker 镜像构建"
            echo
            echo "- 镜像：\`${{ steps.image.outputs.name }}\`"
            echo "- 平台：\`linux/amd64, linux/arm64\`"
            echo "- 推送：\`${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}\`"
            echo "- Digest：\`${{ steps.build.outputs.digest || '仅构建，未生成远程 digest' }}\`"
            echo "- Release：\`v${{ steps.app_version.outputs.value }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
